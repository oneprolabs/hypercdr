services:
  postgres:
    image: postgres:16
    container_name: hypercdr-postgres
    environment:
      POSTGRES_DB: hypercdr
      POSTGRES_USER: hypercdr
      POSTGRES_PASSWORD: hypercdr
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypercdr -d hypercdr"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - hypercdr-postgres-data:/var/lib/postgresql/data

volumes:
  hypercdr-postgres-data:
