<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperCDR</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #f6f8fc; }
      .hcdr-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(37, 99, 235, .08), transparent 30rem),
          linear-gradient(145deg, #f9fbff 0%, #f4f7fb 48%, #eef3fa 100%);
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .hcdr-boot::before {
        content: "";
        position: absolute;
        width: 28rem;
        height: 28rem;
        border: 1px solid rgba(148, 163, 184, .16);
        border-radius: 50%;
        box-shadow: 0 0 0 5rem rgba(255, 255, 255, .2), 0 0 0 10rem rgba(255, 255, 255, .14);
      }
      .hcdr-boot-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
      }
      .hcdr-boot-mark {
        display: grid;
        width: 3.25rem;
        height: 3.25rem;
        grid-template-columns: repeat(2, 1fr);
        gap: .3rem;
        box-sizing: border-box;
        padding: .62rem;
        border: 1px solid rgba(99, 102, 241, .25);
        border-radius: 1rem;
        background: rgba(255, 255, 255, .9);
        box-shadow: 0 1rem 2.5rem rgba(30, 64, 175, .13), inset 0 1px 0 #fff;
      }
      .hcdr-boot-mark i { border-radius: .22rem; background: #2563eb; }
      .hcdr-boot-mark i:nth-child(2), .hcdr-boot-mark i:nth-child(3) { background: #cbd5e1; }
      .hcdr-boot-mark i:nth-child(4) { background: #fbbf24; }
      .hcdr-boot-brand { font-size: 1.05rem; font-weight: 750; letter-spacing: -.025em; }
      .hcdr-boot-brand span { color: #2563eb; }
      .hcdr-boot-progress {
        width: 8rem;
        height: .2rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, .22);
      }
      .hcdr-boot-progress::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2563eb, #6366f1);
        animation: hcdr-boot-progress 1.1s ease-in-out infinite;
      }
      .hcdr-boot-status { margin: -.35rem 0 0; font-size: .68rem; font-weight: 600; color: #94a3b8; letter-spacing: .08em; text-transform: uppercase; }
      @keyframes hcdr-boot-progress {
        from { transform: translateX(-115%); }
        to { transform: translateX(340%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .hcdr-boot-progress::after { animation: none; width: 100%; opacity: .7; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="hcdr-boot" role="status" aria-live="polite" aria-label="Loading HyperCDR">
        <div class="hcdr-boot-content">
          <div class="hcdr-boot-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="hcdr-boot-brand"><span>Hyper</span>CDR</div>
          <div class="hcdr-boot-progress" aria-hidden="true"></div>
          <p class="hcdr-boot-status">Loading console</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
