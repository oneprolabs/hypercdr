<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#f4f7fb"/><rect x="54" y="38" width="1492" height="924" rx="16" fill="#fff" stroke="#d9e2ec"/>
<text x="104" y="100" font-family="Arial" font-size="30" font-weight="700" fill="#142338">Subscription</text><text x="104" y="132" font-family="Arial" font-size="15" fill="#6d7c90">Protect your worker nodes with a plan that fits your organization.</text>
<rect x="104" y="170" width="1392" height="120" rx="11" fill="#f8fafc" stroke="#d9e2ec"/><text x="136" y="208" font-family="Arial" font-size="13" fill="#6d7c90">CURRENT PLAN</text><text x="136" y="250" font-family="Arial" font-size="28" font-weight="700" fill="#1775ed">Flex</text><text x="290" y="250" font-family="Arial" font-size="15" fill="#1775ed">Active</text><line x1="390" y1="195" x2="390" y2="268" stroke="#d9e2ec"/><text x="430" y="208" font-family="Arial" font-size="13" fill="#6d7c90">SUBSCRIBED NODES</text><text x="430" y="250" font-family="Arial" font-size="27" font-weight="700" fill="#142338">5</text><line x1="570" y1="195" x2="570" y2="268" stroke="#d9e2ec"/><text x="610" y="208" font-family="Arial" font-size="13" fill="#6d7c90">USAGE</text><text x="610" y="250" font-family="Arial" font-size="27" font-weight="700" fill="#142338">4 / 5 nodes</text><line x1="830" y1="195" x2="830" y2="268" stroke="#d9e2ec"/><text x="870" y="208" font-family="Arial" font-size="13" fill="#6d7c90">CURRENT BILL</text><text x="870" y="250" font-family="Arial" font-size="27" font-weight="700" fill="#142338">$245 / month</text>
<text x="104" y="350" font-family="Arial" font-size="21" font-weight="700" fill="#142338">Choose a plan</text><text x="104" y="378" font-family="Arial" font-size="14" fill="#6d7c90">Free for up to 2 nodes. Flex charges per node. Business gives unlimited nodes.</text>
<rect x="104" y="410" width="416" height="390" rx="12" fill="#fff" stroke="#d9e2ec"/><text x="136" y="458" font-family="Arial" font-size="23" font-weight="700" fill="#142338">Free</text><text x="136" y="489" font-family="Arial" font-size="14" fill="#6d7c90">For small environments</text><text x="136" y="565" font-family="Arial" font-size="38" font-weight="700" fill="#142338">$0</text><text x="220" y="561" font-family="Arial" font-size="14" fill="#6d7c90">forever</text><line x1="136" y1="595" x2="488" y2="595" stroke="#e5ebf2"/><text x="136" y="635" font-family="Arial" font-size="15" fill="#142338">✓ Up to 2 worker nodes</text><text x="136" y="670" font-family="Arial" font-size="15" fill="#142338">✓ Protection and recovery</text><text x="136" y="705" font-family="Arial" font-size="15" fill="#142338">✓ No payment required</text><rect x="136" y="744" width="352" height="42" rx="6" fill="#fff" stroke="#cbd7e5"/><text x="312" y="771" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#65768b">Current plan</text>
<rect x="548" y="410" width="480" height="390" rx="12" fill="#fff" stroke="#1775ed" stroke-width="2"/><rect x="548" y="410" width="480" height="38" rx="12" fill="#1775ed"/><text x="788" y="436" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">RECOMMENDED</text><text x="580" y="495" font-family="Arial" font-size="23" font-weight="700" fill="#142338">Flex</text><text x="580" y="526" font-family="Arial" font-size="14" fill="#6d7c90">Pay for the nodes you need</text><text x="580" y="590" font-family="Arial" font-size="35" font-weight="700" fill="#142338">$49</text><text x="675" y="586" font-family="Arial" font-size="14" fill="#6d7c90">/ node / month</text><text x="580" y="630" font-family="Arial" font-size="15" fill="#142338">✓ Any number of worker nodes</text><text x="580" y="662" font-family="Arial" font-size="15" fill="#142338">✓ Monthly or annual billing</text><rect x="580" y="710" width="205" height="45" rx="6" fill="#eef5ff" stroke="#b9d5ff"/><text x="682" y="739" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1775ed">5 nodes</text><rect x="797" y="710" width="199" height="45" rx="6" fill="#1775ed"/><text x="896" y="739" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">$245 / month</text><text x="580" y="780" font-family="Arial" font-size="12" fill="#1775ed">Annual billing: pay 10 months</text>
<rect x="1056" y="410" width="440" height="390" rx="12" fill="#142338"/><text x="1092" y="458" font-family="Arial" font-size="23" font-weight="700" fill="#fff">Business</text><text x="1092" y="489" font-family="Arial" font-size="14" fill="#aebbd0">For large-scale protection</text><text x="1092" y="565" font-family="Arial" font-size="38" font-weight="700" fill="#fff">$4,900</text><text x="1092" y="594" font-family="Arial" font-size="14" fill="#aebbd0">/ month</text><line x1="1092" y1="620" x2="1460" y2="620" stroke="#3c4c63"/><text x="1092" y="657" font-family="Arial" font-size="15" fill="#fff">✓ Unlimited worker nodes</text><text x="1092" y="690" font-family="Arial" font-size="15" fill="#fff">✓ Monthly or annual billing</text><text x="1092" y="723" font-family="Arial" font-size="15" fill="#fff">✓ Annual: $49,000 / year</text><rect x="1092" y="748" width="368" height="42" rx="6" fill="#1775ed"/><text x="1276" y="775" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">Contact sales</text>
<rect x="104" y="842" width="1392" height="76" rx="10" fill="#fffaf0" stroke="#f0d69a"/><text x="136" y="873" font-family="Arial" font-size="15" font-weight="700" fill="#7c5b16">30-day over-quota grace period</text><text x="136" y="898" font-family="Arial" font-size="13" fill="#7c5b16">Protection continues during grace. Afterward, new protection tasks pause while existing backups and recovery remain available.</text>
</svg>
