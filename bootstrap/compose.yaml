services:
  hypercdr-postgres:
    image: ${HCDR_IMAGE_REGISTRY:?HCDR_IMAGE_REGISTRY is required}/postgres:16
    container_name: hypercdr-postgres
    environment:
      POSTGRES_DB: hypercdr
      POSTGRES_USER: hypercdr
      POSTGRES_PASSWORD: hypercdr
    volumes:
      - ${HCDR_DATA_DIR:-/data/hypercdr/deploy}/data/postgres:/var/lib/postgresql/data
    ports:
      - ${HCDR_POSTGRES_PORT:-15432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypercdr -d hypercdr"]
      interval: 10s
      timeout: 5s
      retries: 10

  hypercdr-platform-api:
    image: ${HCDR_IMAGE_REGISTRY:?HCDR_IMAGE_REGISTRY is required}/platform-api:${HCDR_IMAGE_TAG:-v20260714.5}
    container_name: hypercdr-platform-api
    depends_on:
      hypercdr-postgres:
        condition: service_healthy
    environment:
      HCDR_HTTP_ADDR: 0.0.0.0:18080
      HCDR_PUBLIC_BASE_URL: ${HCDR_PUBLIC_BASE_URL}
      HCDR_AGENT_WS_ENDPOINT: ${HCDR_AGENT_WS_ENDPOINT}
      HCDR_DATABASE_URL: postgres://hypercdr:hypercdr@hypercdr-postgres:5432/hypercdr?sslmode=disable
      HCDR_IMAGE_REGISTRY: ${HCDR_IMAGE_REGISTRY:?HCDR_IMAGE_REGISTRY is required}
      HCDR_AGENT_IMAGE: ${HCDR_AGENT_IMAGE}
      HCDR_VELERO_IMAGE: ${HCDR_VELERO_IMAGE}
      HCDR_VELERO_AWS_PLUGIN_IMAGE: ${HCDR_VELERO_AWS_PLUGIN_IMAGE}
      HCDR_TLS_ENABLED: "false"
      HCDR_TLS_CERT_FILE: /etc/hypercdr/tls/platform.crt
      HCDR_TLS_KEY_FILE: /etc/hypercdr/tls/platform.key
      HCDR_REGISTRY_CA_PATH: /etc/hypercdr/registry/ca.crt
      HCDR_SECRET_KEY: ${HCDR_SECRET_KEY}
    volumes:
      - ${HCDR_TLS_DIR:-/data/hypercdr/deploy/tls}:/etc/hypercdr/tls:ro
      - ${HCDR_REGISTRY_CA_FILE:-./charts/hypercdr-platform/files/registry-ca.crt}:/etc/hypercdr/registry/ca.crt:ro
    command: ["/bin/sh", "-c", "/usr/local/bin/platform-migrate && exec /usr/local/bin/platform-api"]
    ports:
      - ${HCDR_API_PORT:-18080}:18080
    restart: unless-stopped

  hypercdr-platform-frontend:
    image: ${HCDR_IMAGE_REGISTRY:?HCDR_IMAGE_REGISTRY is required}/platform-frontend:${HCDR_IMAGE_TAG:-v20260714.5}
    container_name: hypercdr-platform-frontend
    depends_on:
      - hypercdr-platform-api
    volumes:
      - ${HCDR_TLS_DIR:?HCDR_TLS_DIR is required}:/etc/hypercdr/tls:ro
    ports:
      - ${HCDR_FRONTEND_PORT:-3002}:3002
    restart: unless-stopped
