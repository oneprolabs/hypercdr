server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/portal.crt;
    ssl_certificate_key /etc/nginx/tls/portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
    location = /api/release-catalog {
        proxy_pass __RELEASE_CENTER_URL__/api/v1/catalog;
        proxy_set_header Authorization "Bearer __RELEASE_CENTER_TOKEN__";
        proxy_set_header Host $host;
    }
}
