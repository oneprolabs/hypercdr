services:
  bootstrap-portal:
    image: ${HCDR_BOOTSTRAP_NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: hypercdr-bootstrap-portal
    restart: unless-stopped
    ports:
      - "${HCDR_BOOTSTRAP_PORT:-8080}:443"
    volumes:
      - ${HCDR_BOOTSTRAP_PORTAL_DIR:-/opt/hypercdr-bootstrap/portal}:/usr/share/nginx/html:ro
      - ${HCDR_BOOTSTRAP_TLS_DIR:-/opt/hypercdr-bootstrap/tls}:/etc/nginx/tls:ro
      - ${HCDR_BOOTSTRAP_NGINX_CONFIG:-./nginx-tls.conf}:/etc/nginx/conf.d/default.conf:ro
