apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hypercdr.fullname" . }}
  labels:
    app.kubernetes.io/component: platform
    {{- include "hypercdr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.platform.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: platform
      {{- include "hypercdr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: platform
        {{- include "hypercdr.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: migrate
          image: {{ include "hypercdr.platformImage" . | quote }}
          imagePullPolicy: {{ .Values.platform.image.pullPolicy }}
          command: ["/usr/local/bin/platform-migrate"]
          envFrom:
            - secretRef:
                name: {{ include "hypercdr.fullname" . }}-config
      containers:
        - name: platform
          image: {{ include "hypercdr.platformImage" . | quote }}
          imagePullPolicy: {{ .Values.platform.image.pullPolicy }}
          command: ["/usr/local/bin/platform-api"]
          ports:
            - name: http
              containerPort: {{ .Values.platform.service.targetPort }}
          env:
            - name: HCDR_HTTP_ADDR
              value: "0.0.0.0:{{ .Values.platform.service.targetPort }}"
            - name: HCDR_PUBLIC_BASE_URL
              value: {{ .Values.global.publicBaseURL | quote }}
            - name: HCDR_AGENT_WS_ENDPOINT
              value: {{ .Values.global.agentWebSocketURL | quote }}
            - name: HCDR_IMAGE_REGISTRY
              value: {{ .Values.global.imageRegistry | quote }}
            - name: HCDR_AGENT_NAMESPACE
              value: {{ .Values.platform.agentNamespace | quote }}
            - name: HCDR_LOG_LEVEL
              value: {{ .Values.platform.logLevel | quote }}
            - name: HCDR_FRONTEND_DIR
              value: /opt/hypercdr/frontend
            - name: HCDR_REGISTRY_CA_PATH
              value: /etc/hypercdr/registry/ca.crt
            - name: HCDR_TLS_ENABLED
              value: {{ ternary "true" "false" .Values.platform.tls.enabled | quote }}
            {{- if .Values.platform.tls.enabled }}
            - name: HCDR_TLS_CERT_FILE
              value: /etc/hypercdr/tls/tls.crt
            - name: HCDR_TLS_KEY_FILE
              value: /etc/hypercdr/tls/tls.key
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "hypercdr.fullname" . }}-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" .Values.platform.tls.enabled }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" .Values.platform.tls.enabled }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            {{- if and .Values.platform.registryCA.enabled (.Files.Get "files/registry-ca.crt") }}
            - name: registry-ca
              mountPath: /etc/hypercdr/registry
              readOnly: true
            {{- end }}
            {{- if .Values.platform.tls.enabled }}
            - name: platform-tls
              mountPath: /etc/hypercdr/tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.platform.resources | nindent 12 }}
      volumes:
        {{- if and .Values.platform.registryCA.enabled (.Files.Get "files/registry-ca.crt") }}
        - name: registry-ca
          secret:
            secretName: {{ include "hypercdr.fullname" . }}-registry-ca
        {{- end }}
        {{- if .Values.platform.tls.enabled }}
        - name: platform-tls
          secret:
            secretName: {{ include "hypercdr.fullname" . }}-tls
        {{- end }}
