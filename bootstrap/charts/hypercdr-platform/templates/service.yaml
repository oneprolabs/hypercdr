apiVersion: v1
kind: Service
metadata:
  name: {{ include "hypercdr.fullname" . }}
  labels:
    {{- include "hypercdr.labels" . | nindent 4 }}
spec:
  type: {{ .Values.platform.service.type }}
  ports:
    - name: http
      port: {{ .Values.platform.service.port }}
      targetPort: http
      {{- if and (eq .Values.platform.service.type "NodePort") .Values.platform.service.nodePort }}
      nodePort: {{ .Values.platform.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/component: platform
    {{- include "hypercdr.selectorLabels" . | nindent 4 }}
