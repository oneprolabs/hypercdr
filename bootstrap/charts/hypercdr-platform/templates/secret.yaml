apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hypercdr.fullname" . }}-config
  labels:
    {{- include "hypercdr.labels" . | nindent 4 }}
type: Opaque
stringData:
  HCDR_DATABASE_URL: {{ include "hypercdr.databaseURL" . | quote }}
  HCDR_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
{{- if .Values.platform.registryCA.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hypercdr.fullname" . }}-registry-ca
  labels:
    {{- include "hypercdr.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ required "platform.registryCA.certificate is required when registryCA is enabled" .Values.platform.registryCA.certificate | b64enc }}
{{- end }}
{{- if .Values.platform.tls.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hypercdr.fullname" . }}-tls
  labels:
    {{- include "hypercdr.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.platform.tls.cert | b64enc }}
  tls.key: {{ .Values.platform.tls.key | b64enc }}
{{- end }}
