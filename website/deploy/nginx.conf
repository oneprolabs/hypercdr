# 文档站 nginx 配置（容器内使用）。
#
# 由 .github/workflows/docs.yml 放到服务器上，以只读方式挂载到独立容器
# hypercdr-docs 的 /etc/nginx/conf.d/default.conf。因为这个容器不属于
# docker-compose.yaml 里的任何 service，release 部署的任何脚本都不会碰它。
#
# 容器内路径与端口是固定的（443 + /usr/share/nginx/html），证书直接复用
# release 部署生成的自签证书，与 hypercdr-website 原来的做法一致。
#
# 站点是 VitePress 静态产物且开启 cleanUrls，页面文件是 foo.html 而不是
# foo/index.html，所以 /docs/foo 必须由 $uri.html 兜底，否则会回落到 404。
server {
    listen 443 ssl default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/hypercdr/tls/tls.crt;
    ssl_certificate_key /etc/hypercdr/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 带内容哈希的构建产物可以长缓存；public/ 下的原样图片没有哈希，
    # 用较短的 TTL，避免替换截图后网关与浏览器长期命中旧图。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
