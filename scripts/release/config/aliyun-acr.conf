# HyperCDR public release registry: Alibaba Cloud ACR Personal Edition.
# Region: China North 3 (Zhangjiakou)
# Namespace: onepro
#
# Component repository names are appended to this namespace prefix, for example:
#   .../onepro/platform-api:vYYYYMMDD.N
#   .../onepro/comm-agent:vYYYYMMDD.N
# Create each component repository in ACR before the first push if automatic
# repository creation is disabled.

HCDR_REGISTRY_PROVIDER=aliyun-acr
HCDR_REGISTRY_VISIBILITY=public
HCDR_REGISTRY_SERVER=crpi-tne0uo16mzanbvpi.cn-zhangjiakou.personal.cr.aliyuncs.com
HCDR_IMAGE_REGISTRY=crpi-tne0uo16mzanbvpi.cn-zhangjiakou.personal.cr.aliyuncs.com/onepro
HCDR_REGISTRY_TRUST=system

# Push authentication is intentionally not stored here. Run once on the build host:
#   docker login crpi-tne0uo16mzanbvpi.cn-zhangjiakou.personal.cr.aliyuncs.com
# For CI, set HCDR_REGISTRY_USERNAME and HCDR_REGISTRY_PASSWORD through secrets.

HCDR_BUILD_GOPROXY=https://goproxy.cn,direct
HCDR_BUILD_NPM_REGISTRY=https://registry.npmmirror.com
HCDR_VELERO_PLUGIN_SOURCE_REGISTRY=docker.m.daocloud.io/velero
HCDR_RUNTIME_ROOT=/data/hypercdr-runtime
HCDR_BUILD_ROOT=/data/hypercdr-runtime/build/platform
HCDR_CACHE_ROOT=/data/hypercdr-runtime/cache
HCDR_RELEASE_SKIP_TESTS=false
