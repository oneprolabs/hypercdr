# HyperCDR release configuration for the default Aliyun ACR target.
# Release version consumed by release-all.sh.
RELEASE_VERSION=1.0.39.20260917
# Local credentials file. A relative path is resolved from this file's directory.
# Copy release.secrets.conf.example to this path and protect it with mode 0600.
HCDR_RELEASE_SECRETS_FILE=./release.secrets.conf

# Registry profile configuration and selected profile.
HCDR_REGISTRY_CONFIG=/data/hypercdr-main/config/registries.conf
HCDR_ACTIVE_REGISTRY=aliyun_acr
HCDR_IMAGE_REGISTRY=crpi-tne0uo16mzanbvpi.cn-zhangjiakou.personal.cr.aliyuncs.com/hypercdr
HCDR_REGISTRY_SERVER=crpi-tne0uo16mzanbvpi.cn-zhangjiakou.personal.cr.aliyuncs.com

# Login credentials are defined in HCDR_RELEASE_SECRETS_FILE.

# Release Center publication endpoint and token file. Leave empty to skip publication.
HCDR_RELEASE_CENTER_URL=
HCDR_RELEASE_CENTER_TOKEN_FILE=
# HCDR_RELEASE_CENTER_CA_FILE=/secure/path/release-center-ca.crt

# Build dependency mirrors.
HCDR_BUILD_GOPROXY=https://goproxy.cn,direct
HCDR_BUILD_NPM_REGISTRY=https://registry.npmmirror.com
HCDR_VELERO_PLUGIN_SOURCE_REGISTRY=docker.m.daocloud.io/velero

# External build output and dependency cache directories.
HCDR_RUNTIME_ROOT=/data/hypercdr-runtime
HCDR_BUILD_ROOT=/data/hypercdr-runtime/build/platform
HCDR_CACHE_ROOT=/data/hypercdr-runtime/cache

# Login challenge embedded into the private installer package. The Site Key is
# public; its matching Secret Key is read from HCDR_RELEASE_SECRETS_FILE.
HCDR_AUTH_CHALLENGE_MODE=turnstile
HCDR_TURNSTILE_SITE_KEY=0x4AAAAAAE1aPun8kmyyOjlS
HCDR_TURNSTILE_VERIFY_URL=https://challenges.cloudflare.com/turnstile/v0/siteverify

# Release behavior defaults. Command-line options override these values.
HCDR_RELEASE_SKIP_TESTS=false
