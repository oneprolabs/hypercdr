name: Build and Publish Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version: {description: 'Release version in MAJOR.MINOR.PATCH.YYYYMMDD format', required: true}
      registry_profile: {description: 'Profile from config/registries.conf', required: true, default: aliyun_acr}
      deploy: {description: 'Deploy the published version to the configured environment', required: true, default: false, type: boolean}
concurrency: {group: hypercdr-release, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  prepare-release:
    outputs:
      image_version: ${{ steps.release.outputs.version }}
      release_ref: ${{ steps.release.outputs.ref }}
      registry_profile: ${{ steps.release.outputs.profile }}
      registry_server: ${{ steps.release.outputs.server }}
      registry_prefix: ${{ steps.release.outputs.prefix }}
      build_time: ${{ steps.release.outputs.build_time }}
      release_date: ${{ steps.release.outputs.release_date }}
      git_commit: ${{ steps.release.outputs.git_commit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release and registry
        id: release
        shell: bash
        run: |
          version="${{ inputs.version }}"
          profile="${{ inputs.registry_profile }}"
          ref="${GITHUB_SHA}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; ref="${GITHUB_REF_NAME}"; profile="aliyun_acr"; fi
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]{8}$ ]] || { echo "invalid release version: ${version}" >&2; exit 2; }
          source scripts/lib/registry-config.sh
          load_registry_profile config/registries.conf "${profile}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "profile=${profile}" >> "${GITHUB_OUTPUT}"
          echo "server=${HCDR_REGISTRY_SERVER}" >> "${GITHUB_OUTPUT}"
          echo "prefix=${HCDR_IMAGE_REGISTRY}" >> "${GITHUB_OUTPUT}"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          echo "release_date=$(date -u +%Y/%m/%d)" >> "${GITHUB_OUTPUT}"
          echo "git_commit=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

  test-core:
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, agent/comm-agent, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: ${{ matrix.component != 'frontend' }}
        with:
          go-version: '1.25.13'
          cache-dependency-path: ${{ matrix.component }}/go.sum
      - uses: actions/setup-node@v4
        if: ${{ matrix.component == 'frontend' }}
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test ${{ matrix.component }}
        env:
          HCDR_RUNTIME_ROOT: /tmp/hypercdr-runtime
        run: |
          if [ '${{ matrix.component }}' = frontend ]; then
            cd frontend
            npm ci
            npm run test:extensions
            npm run test:topology
            npx tsc --noEmit
          else
            cd '${{ matrix.component }}'
            GOTOOLCHAIN=local go test ./...
          fi

  build-images:
    name: build-images (${{ matrix.image_name }})
    needs: [prepare-release, test-core]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: platform-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image_name: platform-frontend
            context: .
            dockerfile: ./frontend/Dockerfile
          - image_name: comm-agent
            context: ./agent/comm-agent
            dockerfile: ./agent/comm-agent/Dockerfile
          - image_name: oadp-comm-agent
            context: ./agent/comm-agent
            dockerfile: ./agent/comm-agent/oadp.Dockerfile
          - image_name: cluster-registration-executor
            context: ./backend
            dockerfile: ./backend/cluster-registration-executor.Dockerfile
          - image_name: dependencies
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image reference
        if: ${{ matrix.image_name != 'dependencies' }}
        id: image
        shell: bash
        run: |
          source scripts/lib/registry-config.sh
          echo "ref=$(image_ref '${{ needs.prepare-release.outputs.registry_prefix }}' '${{ matrix.image_name }}' '${{ needs.prepare-release.outputs.image_version }}')" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v3
      - name: Login to release registry with retry
        env:
          REGISTRY: ${{ needs.prepare-release.outputs.registry_server }}
          REGISTRY_USERNAME: ${{ needs.prepare-release.outputs.registry_profile == 'aliyun_acr' && secrets.ALIYUN_REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ needs.prepare-release.outputs.registry_profile == 'aliyun_acr' && secrets.ALIYUN_REGISTRY_PASSWORD || secrets.REGISTRY_PASSWORD }}
        run: |
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Build and push ${{ matrix.image_name }}
        if: ${{ matrix.image_name != 'dependencies' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            NPM_REGISTRY=https://registry.npmmirror.com
            VERSION=${{ needs.prepare-release.outputs.image_version }}
            GIT_COMMIT=${{ needs.prepare-release.outputs.git_commit }}
            BUILD_TIME=${{ needs.prepare-release.outputs.build_time }}
            RELEASE_DATE=${{ needs.prepare-release.outputs.release_date }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

      - name: Publish runtime, Velero, and OADP images
        if: ${{ matrix.image_name == 'dependencies' }}
        env:
          HCDR_RUNTIME_ROOT: /tmp/hypercdr-runtime
          HCDR_RELEASE_PHASE: dependencies
          HCDR_OADP_PARALLELISM: '3'
          HCDR_OADP_IMAGE_TIMEOUT_SECONDS: '3600'
          GITHUB_TOKEN: ${{ github.token }}
          HCDR_AUTH_CHALLENGE_MODE: ${{ vars.HCDR_AUTH_CHALLENGE_MODE || 'turnstile' }}
          HCDR_TURNSTILE_SITE_KEY: ${{ secrets.HCDR_TURNSTILE_SITE_KEY }}
          HCDR_TURNSTILE_SECRET_KEY: ${{ secrets.HCDR_TURNSTILE_SECRET_KEY }}
          HCDR_CONTAINER_POLICY: /tmp/hypercdr-runtime/containers-policy.json
          RELEASE_REGISTRY_USERNAME: ${{ needs.prepare-release.outputs.registry_profile == 'aliyun_acr' && secrets.ALIYUN_REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          RELEASE_REGISTRY_PASSWORD: ${{ needs.prepare-release.outputs.registry_profile == 'aliyun_acr' && secrets.ALIYUN_REGISTRY_PASSWORD || secrets.REGISTRY_PASSWORD }}
        run: |
          mkdir -p "${HCDR_RUNTIME_ROOT}"
          printf '%s\n' '{"default":[{"type":"insecureAcceptAnything"}]}' > "${HCDR_CONTAINER_POLICY}"
          cat > "${RUNNER_TEMP}/release.conf" <<EOF
          RELEASE_VERSION=${{ needs.prepare-release.outputs.image_version }}
          HCDR_RELEASE_SECRETS_FILE=${RUNNER_TEMP}/release.secrets.conf
          EOF
          (umask 077; cat > "${RUNNER_TEMP}/release.secrets.conf" <<EOF
          HCDR_REGISTRY_SERVER=${{ needs.prepare-release.outputs.registry_server }}
          HCDR_REGISTRY_USERNAME=${RELEASE_REGISTRY_USERNAME}
          HCDR_REGISTRY_PASSWORD=${RELEASE_REGISTRY_PASSWORD}
          HCDR_AUTH_CHALLENGE_MODE=${{ vars.HCDR_AUTH_CHALLENGE_MODE || 'turnstile' }}
          HCDR_TURNSTILE_SITE_KEY=${{ secrets.HCDR_TURNSTILE_SITE_KEY }}
          HCDR_TURNSTILE_SECRET_KEY=${{ secrets.HCDR_TURNSTILE_SECRET_KEY }}
          EOF
          )
          export HCDR_REGISTRY_CONFIG="${GITHUB_WORKSPACE}/config/registries.conf"
          export HCDR_REGISTRY_PROFILE="${{ needs.prepare-release.outputs.registry_profile }}"
          ./scripts/release/release-all.sh --config "${RUNNER_TEMP}/release.conf"
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.image_name == 'dependencies' }}
        with:
          name: hypercdr-oadp-lock-${{ needs.prepare-release.outputs.image_version }}
          path: /tmp/hypercdr-runtime/oadp-mirror/resolved-image-lock.json
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [prepare-release, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hypercdr-oadp-lock-${{ needs.prepare-release.outputs.image_version }}
          path: /tmp/hypercdr-runtime/oadp-mirror
      - name: Login to release registry with retry
        env:
          REGISTRY: ${{ needs.prepare-release.outputs.registry_server }}
          REGISTRY_USERNAME: ${{ needs.prepare-release.outputs.registry_profile == 'aliyun_acr' && secrets.ALIYUN_REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ needs.prepare-release.outputs.registry_profile == 'aliyun_acr' && secrets.ALIYUN_REGISTRY_PASSWORD || secrets.REGISTRY_PASSWORD }}
        run: |
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Verify images and package release
        env:
          HCDR_RUNTIME_ROOT: /tmp/hypercdr-runtime
          HCDR_RELEASE_PHASE: finalize
          HCDR_RELEASE_PULL_PARALLELISM: '4'
          HCDR_RELEASE_PULL_TIMEOUT_SECONDS: '3600'
          HCDR_AUTH_CHALLENGE_MODE: ${{ vars.HCDR_AUTH_CHALLENGE_MODE || 'turnstile' }}
          HCDR_TURNSTILE_SITE_KEY: ${{ secrets.HCDR_TURNSTILE_SITE_KEY }}
          HCDR_TURNSTILE_SECRET_KEY: ${{ secrets.HCDR_TURNSTILE_SECRET_KEY }}
          HCDR_CONTAINER_POLICY: /tmp/hypercdr-runtime/containers-policy.json
          RELEASE_REGISTRY_USERNAME: ${{ needs.prepare-release.outputs.registry_profile == 'aliyun_acr' && secrets.ALIYUN_REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          RELEASE_REGISTRY_PASSWORD: ${{ needs.prepare-release.outputs.registry_profile == 'aliyun_acr' && secrets.ALIYUN_REGISTRY_PASSWORD || secrets.REGISTRY_PASSWORD }}
        run: |
          mkdir -p "${HCDR_RUNTIME_ROOT}"
          printf '%s\n' '{"default":[{"type":"insecureAcceptAnything"}]}' > "${HCDR_CONTAINER_POLICY}"
          cat > "${RUNNER_TEMP}/release.conf" <<EOF
          RELEASE_VERSION=${{ needs.prepare-release.outputs.image_version }}
          HCDR_RELEASE_SECRETS_FILE=${RUNNER_TEMP}/release.secrets.conf
          EOF
          (umask 077; cat > "${RUNNER_TEMP}/release.secrets.conf" <<EOF
          HCDR_REGISTRY_SERVER=${{ needs.prepare-release.outputs.registry_server }}
          HCDR_REGISTRY_USERNAME=${RELEASE_REGISTRY_USERNAME}
          HCDR_REGISTRY_PASSWORD=${RELEASE_REGISTRY_PASSWORD}
          HCDR_AUTH_CHALLENGE_MODE=${{ vars.HCDR_AUTH_CHALLENGE_MODE || 'turnstile' }}
          HCDR_TURNSTILE_SITE_KEY=${{ secrets.HCDR_TURNSTILE_SITE_KEY }}
          HCDR_TURNSTILE_SECRET_KEY=${{ secrets.HCDR_TURNSTILE_SECRET_KEY }}
          EOF
          )
          export HCDR_REGISTRY_CONFIG="${GITHUB_WORKSPACE}/config/registries.conf"
          export HCDR_REGISTRY_PROFILE="${{ needs.prepare-release.outputs.registry_profile }}"
          ./scripts/release/release-all.sh --config "${RUNNER_TEMP}/release.conf"
      - uses: actions/upload-artifact@v4
        with:
          name: hypercdr-installer-${{ needs.prepare-release.outputs.image_version }}
          path: /tmp/hypercdr-runtime/releases/community/${{ needs.prepare-release.outputs.image_version }}/*
          if-no-files-found: error
          overwrite: true
      - name: Publish installer assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ needs.prepare-release.outputs.image_version }}
          generate_release_notes: true
          files: |
            /tmp/hypercdr-runtime/releases/community/${{ needs.prepare-release.outputs.image_version }}/hypercdr-installer-${{ needs.prepare-release.outputs.image_version }}.tar.gz
            /tmp/hypercdr-runtime/releases/community/${{ needs.prepare-release.outputs.image_version }}/hypercdr-installer-${{ needs.prepare-release.outputs.image_version }}.sha256

  deploy:
    needs: [prepare-release, build-images]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check SSH access
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.HCDR_SSH_HOST }}
          username: ${{ vars.HCDR_SSH_USER }}
          port: ${{ vars.HCDR_SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            echo "connected as $(id -un) on $(hostname)"
            mkdir -p '${{ vars.HCDR_DEPLOY_PATH }}'
            test -w '${{ vars.HCDR_DEPLOY_PATH }}'
      - uses: appleboy/ssh-action@v1.0.3
        env:
          HCDR_AUTH_CHALLENGE_MODE: ${{ vars.HCDR_AUTH_CHALLENGE_MODE || 'turnstile' }}
          HCDR_TURNSTILE_SITE_KEY: ${{ secrets.HCDR_TURNSTILE_SITE_KEY }}
          HCDR_TURNSTILE_SECRET_KEY: ${{ secrets.HCDR_TURNSTILE_SECRET_KEY }}
        with:
          host: ${{ vars.HCDR_SSH_HOST }}
          username: ${{ vars.HCDR_SSH_USER }}
          port: ${{ vars.HCDR_SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3600s
          envs: HCDR_AUTH_CHALLENGE_MODE,HCDR_TURNSTILE_SITE_KEY,HCDR_TURNSTILE_SECRET_KEY
          script: |
            set -eu
            deploy_path='${{ vars.HCDR_DEPLOY_PATH }}'
            source_path="${deploy_path}/source"
            log_file="${deploy_path}/deploy-${{ needs.prepare-release.outputs.image_version }}.log"
            exec 3>&1 4>&2
            exec >"${log_file}" 2>&1
            trap 'status=$?; if [ "$status" -ne 0 ]; then cat "${log_file}" >&3; fi; exit "$status"' EXIT
            ref='${{ needs.prepare-release.outputs.release_ref }}'
            mkdir -p "${source_path}/docker/nginx" "${source_path}/scripts/release"
            fetch_asset() {
              local path="$1"
              local destination="${source_path}/${path}"
              mkdir -p "$(dirname "${destination}")"
              curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${ref}/${path}" -o "${destination}.tmp"
              mv "${destination}.tmp" "${destination}"
            }
            fetch_asset docker-compose.yml
            fetch_asset docker/nginx/edge.conf
            fetch_asset docker/nginx/upstream.conf.default
            fetch_asset scripts/release/deploy-blue-green.sh
            fetch_asset scripts/lib/registry-config.sh
            chmod +x "${source_path}/scripts/release/deploy-blue-green.sh"
            mkdir -p "${deploy_path}/nginx/conf.d"
            legacy_install=false
            if [ -f "${deploy_path}/.env" ] && { \
              ! grep -q '^PLATFORM_API_BLUE_IMAGE=' "${deploy_path}/.env" || \
              ! grep -q '^PLATFORM_API_GREEN_IMAGE=' "${deploy_path}/.env"; \
            }; then
              legacy_install=true
            fi
            if [ "$legacy_install" = true ] || [ ! -f "${deploy_path}/.env" ]; then
              fetch_asset scripts/release/install-blue-green.sh
              fetch_asset scripts/release/start-platform.sh
              fetch_asset scripts/release/stop-platform.sh
              fetch_asset scripts/release/restart-platform.sh
              fetch_asset scripts/release/templates/hypercdr.service
              chmod +x "${source_path}/scripts/release/install-blue-green.sh"
              "${source_path}/scripts/release/install-blue-green.sh" \
                '${{ needs.prepare-release.outputs.image_version }}' \
                --base-url 'https://${{ vars.HCDR_DOMAIN }}' \
                --domain '${{ vars.HCDR_DOMAIN }}' \
                --registry '${{ vars.HCDR_IMAGE_REGISTRY }}' \
                --install-dir "${deploy_path}" \
                --execute
            else
              install -m 0644 "${source_path}/docker-compose.yml" "${deploy_path}/docker-compose.yaml"
              install -m 0644 "${source_path}/docker/nginx/edge.conf" "${deploy_path}/nginx/conf.d/default.conf"
              install -m 0755 "${source_path}/scripts/release/deploy-blue-green.sh" "${deploy_path}/deploy-blue-green.sh"
              install -m 0644 "${source_path}/scripts/lib/registry-config.sh" "${deploy_path}/registry-config.sh"
              HCDR_INSTALL_DIR="${deploy_path}" "${deploy_path}/deploy-blue-green.sh" '${{ needs.prepare-release.outputs.image_version }}'
            fi
