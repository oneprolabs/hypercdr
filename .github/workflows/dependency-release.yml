name: Publish Dependency Images
on:
  workflow_dispatch:
    inputs:
      registry_profile:
        description: Registry profile from config/registries.conf
        required: true
        default: aliyun_acr
      rebuild_id:
        description: Optional unique suffix for a forced rebuild; never overwrites an existing input tag
        required: false
  push:
    branches: [main]
    paths:
      - packaging/dependencies/**
      - packaging/oadp/**
      - third_party/velero/**
      - scripts/release/dependency-*
      - scripts/release/publish-dependencies.py
      - scripts/release/build-velero.sh
      - scripts/release/build-community-oadp-*.sh
      - scripts/release/common.sh
      - scripts/lib/registry-config.sh
      - .github/workflows/dependency-release.yml
permissions:
  contents: read
concurrency:
  group: dependency-release-${{ inputs.registry_profile || 'aliyun_acr' }}
  cancel-in-progress: false
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Test dependency publication contracts
        run: |
          python3 -B scripts/tests/dependency-manifest.py
          python3 -B scripts/tests/publish-dependencies.py
          bash scripts/tests/dependency-registry.sh
          bash scripts/tests/release-workflow.sh
      - uses: docker/setup-buildx-action@v3
      - name: Resolve registry profile
        id: registry
        env:
          PROFILE: ${{ inputs.registry_profile || 'aliyun_acr' }}
        run: |
          source scripts/lib/registry-config.sh
          load_registry_profile config/registries.conf "$PROFILE"
          echo "server=$HCDR_REGISTRY_SERVER" >> "$GITHUB_OUTPUT"
          echo "prefix=$HCDR_IMAGE_REGISTRY" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.server }}
          username: ${{ (inputs.registry_profile == 'aliyun_acr' || inputs.registry_profile == '') && secrets.ALIYUN_REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          password: ${{ (inputs.registry_profile == 'aliyun_acr' || inputs.registry_profile == '') && secrets.ALIYUN_REGISTRY_PASSWORD || secrets.REGISTRY_PASSWORD }}
      - name: Publish only missing dependency inputs
        env:
          REGISTRY: ${{ steps.registry.outputs.prefix }}
          REBUILD_ID: ${{ inputs.rebuild_id }}
          GITHUB_TOKEN: ${{ github.token }}
          HCDR_RUNTIME_ROOT: /tmp/hypercdr-runtime
          HCDR_CONTAINER_POLICY: /tmp/hypercdr-runtime/containers-policy.json
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p "$HCDR_RUNTIME_ROOT"
          printf '%s\n' '{"default":[{"type":"insecureAcceptAnything"}]}' > "$HCDR_CONTAINER_POLICY"
          python3 -B scripts/release/publish-dependencies.py \
            --registry "$REGISTRY" --runtime "$HCDR_RUNTIME_ROOT/dependencies" \
            --output "$HCDR_RUNTIME_ROOT/dependencies/dependency-manifest.json" \
            --rebuild-id "$REBUILD_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: hypercdr-dependencies-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/hypercdr-runtime/dependencies/dependency-manifest.json
          if-no-files-found: error
          retention-days: 90
