name: AI PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Validate LLM configuration
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "${LLM_API_KEY}" || { echo "::error::LLM_API_KEY is required"; exit 1; }
          test -n "${LLM_BASE_URL}" || { echo "::error::LLM_BASE_URL is required"; exit 1; }

      - name: Review and describe pull request
        id: pr_agent
        uses: The-PR-Agent/pr-agent@8e4d32e5497defd43c023a404f73560c62728961
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI.API_BASE: ${{ secrets.LLM_BASE_URL }}
          CONFIG.MODEL: ${{ vars.LLM_MODEL || 'openai/deepseek-v3' }}
          CONFIG.FALLBACK_MODELS: >-
            ["${{ vars.LLM_MODEL || 'openai/deepseek-v3' }}"]
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: ${{ vars.LLM_MODEL_MAX_TOKENS || '64000' }}
          CONFIG.RESPONSE_LANGUAGE: en-US
          CONFIG.REPO_CONTEXT_FILES: '["PR_WORKFLOW.md"]'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/describe", "/review"]'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'

      - name: Notify Feishu
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT_OUTCOME: ${{ steps.pr_agent.outcome }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          set -euo pipefail
          if [ -z "${FEISHU_WEBHOOK}" ]; then
            echo "::warning::FEISHU_WEBHOOK is not configured; skipping notification."
            exit 0
          fi

          case "${PR_AGENT_OUTCOME}" in
            success) STATUS="✅ AI PR review completed"; TEMPLATE="green" ;;
            *) STATUS="❌ AI PR review failed"; TEMPLATE="red" ;;
          esac

          PAYLOAD="$(jq -n \
            --arg status "${STATUS}" \
            --arg template "${TEMPLATE}" \
            --arg number "${PR_NUMBER}" \
            --arg title "${PR_TITLE}" \
            --arg author "${PR_AUTHOR}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg head "${PR_HEAD_REF}" \
            --arg base "${PR_BASE_REF}" \
            --arg files "${PR_CHANGED_FILES}" \
            --arg additions "${PR_ADDITIONS}" \
            --arg deletions "${PR_DELETIONS}" \
            --arg url "${PR_URL}" \
            '{
              msg_type: "interactive",
              card: {
                schema: "2.0",
                config: {wide_screen_mode: true},
                header: {
                  title: {tag: "plain_text", content: ("HyperCDR AI PR Review #" + $number)},
                  template: $template
                },
                body: {elements: [
                  {tag: "markdown", content: ("**" + $status + "**\n\n" + $title)},
                  {tag: "markdown", content: ("仓库：" + $repository + "\n作者：" + $author + "\n分支：" + $head + " → " + $base + "\n变更：" + $files + " files | +" + $additions + " / -" + $deletions)},
                  {tag: "hr"},
                  {tag: "button", text: {tag: "plain_text", content: "查看 PR"}, type: "primary", behaviors: [{type: "open_url", default_url: {url: $url}}]}
                ]}
              }
            }')"

          curl --fail --silent --show-error --retry 3 --max-time 20 \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" "${FEISHU_WEBHOOK}"
