name: AI PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Validate LLM configuration
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "${LLM_API_KEY}" || { echo "::error::LLM_API_KEY is required"; exit 1; }
          test -n "${LLM_BASE_URL}" || { echo "::error::LLM_BASE_URL is required"; exit 1; }

      - name: Review and describe pull request
        uses: The-PR-Agent/pr-agent@8e4d32e5497defd43c023a404f73560c62728961
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI.API_BASE: ${{ secrets.LLM_BASE_URL }}
          CONFIG.MODEL: ${{ vars.LLM_MODEL || 'openai/deepseek-v3' }}
          CONFIG.FALLBACK_MODELS: >-
            ["${{ vars.LLM_MODEL || 'openai/deepseek-v3' }}"]
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: ${{ vars.LLM_MODEL_MAX_TOKENS || '64000' }}
          CONFIG.RESPONSE_LANGUAGE: en-US
          CONFIG.REPO_CONTEXT_FILES: '["PR_WORKFLOW.md"]'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/describe", "/review"]'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'
