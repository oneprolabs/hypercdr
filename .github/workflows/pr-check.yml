name: Pull Request Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [backend, agent/comm-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: find scripts bootstrap -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Test Bootstrap registry trust flow
        run: bash bootstrap/tests/registry-ca-flow.sh
      - name: Test registry profile selection
        run: bash scripts/tests/registry-config.sh
      - name: Reject generated artifacts
        run: |
          test ! -e frontend/node_modules
          test -z "$(git ls-files | grep -E '(^|/)\.playwright-cli/|(^|/)output/playwright/')"
          test -z "$(git ls-files -- ':!third_party/**' '*.log' '*.pid' '*.key' '*.pem' '*.crt')"
