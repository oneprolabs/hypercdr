name: Pull Request Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [backend, agent/comm-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test, type-check, and build outside the source tree
        run: ./scripts/build-frontend.sh

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: find scripts bootstrap -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Test registry profile selection
        run: bash scripts/tests/registry-config.sh
      - name: Test blue/green deployment contracts
        run: |
          bash scripts/tests/blue-green-deploy.sh
          bash scripts/tests/blue-green-compose.sh
          bash scripts/tests/release-workflow.sh
          bash scripts/tests/oadp-mirror.sh
          bash scripts/tests/pr-review-notification.sh
      - name: Reject generated artifacts
        run: bash scripts/tests/repository-hygiene.sh
      - name: Reject tracked secrets and logs
        run: test -z "$(git ls-files -- ':!third_party/**' '*.log' '*.pid' '*.key' '*.pem' '*.crt')"
