name: Pull Request Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [backend, agent/comm-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Vet and check formatting
        run: |
          cd '${{ matrix.module }}'
          go vet ./...
          test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - name: Test ${{ matrix.module }}
        run: |
          if [ '${{ matrix.module }}' = backend ]; then
            ./scripts/test-backend.sh
          else
            cd '${{ matrix.module }}'
            go test ./...
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test, type-check, and build outside the source tree
        run: ./scripts/build-frontend.sh

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Test registry profile selection
        run: bash scripts/tests/registry-config.sh
      - name: Test blue/green deployment contracts
        run: |
          bash scripts/tests/blue-green-deploy.sh
          bash scripts/tests/blue-green-compose.sh
          bash scripts/tests/release-workflow.sh
          bash scripts/tests/oadp-mirror.sh
          bash scripts/tests/pr-review-notification.sh
      - name: Check development provenance and deployment inputs
        run: |
          python3 -B scripts/tests/dev-provenance.py
          python3 -B scripts/tests/deployment-inputs.py
      - name: Reject generated artifacts
        run: bash scripts/tests/repository-hygiene.sh
      - name: Reject tracked secrets and logs
        run: test -z "$(git ls-files -- ':!third_party/**' '*.log' '*.pid' '*.key' '*.pem' '*.crt')"

  docker:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api, context: ./backend, file: ./backend/Dockerfile}
          - {name: frontend, context: ., file: ./frontend/Dockerfile}
          - {name: executor, context: ./backend, file: ./backend/cluster-registration-executor.Dockerfile}
          - {name: agent, context: ./agent/comm-agent, file: ./agent/comm-agent/Dockerfile}
          - {name: oadp-agent, context: ./agent/comm-agent, file: ./agent/comm-agent/oadp.Dockerfile}
          - {name: dev-api, context: ., file: ./docker/dev/api.Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: hypercdr-pr-${{ matrix.name }}:check
          platforms: linux/amd64
          cache-from: type=gha,scope=pr-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.name }}
      - name: Smoke built API with real PostgreSQL
        if: ${{ matrix.name == 'api' || matrix.name == 'dev-api' }}
        run: ./scripts/tests/api-image-smoke.sh hypercdr-pr-${{ matrix.name }}:check
