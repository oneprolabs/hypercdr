services:
  hypercdr-edge:
    image: ${HCDR_EDGE_IMAGE:-registry.cn-beijing.aliyuncs.com/oneprolabs/hypercdr:nginx-1.27-alpine}
    container_name: hypercdr-edge
    ports:
      - "${HCDR_HTTPS_PORT:-12443}:443"
    volumes:
      - ${HCDR_NGINX_CONFIG_DIR:-./nginx/conf.d}:/etc/nginx/conf.d:ro
      - ${HCDR_TLS_CERT_FILE:-./tls.crt}:/etc/hypercdr/tls/tls.crt:ro
      - ${HCDR_TLS_KEY_FILE:-./tls.key}:/etc/hypercdr/tls/tls.key:ro
    networks: [hypercdr-proxy, hypercdr-blue, hypercdr-green]
    restart: unless-stopped
    logging:
      driver: local
      options: { max-size: "50m", max-file: "5" }

  hypercdr-postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    container_name: hypercdr-postgres
    environment:
      POSTGRES_DB: hypercdr
      POSTGRES_USER: hypercdr
      POSTGRES_PASSWORD: ${HCDR_POSTGRES_PASSWORD:?HCDR_POSTGRES_PASSWORD is required}
    volumes:
      - ${HCDR_INSTALL_DIR:-/var/lib/hypercdr}/data/postgres:/var/lib/postgresql/data
    networks: [hypercdr-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypercdr -d hypercdr"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: local
      options: { max-size: "50m", max-file: "5" }

  hypercdr-platform-api-blue:
    image: ${PLATFORM_API_BLUE_IMAGE:?PLATFORM_API_BLUE_IMAGE is required}
    container_name: hypercdr-platform-api-blue
    profiles: [blue]
    depends_on:
      hypercdr-postgres:
        condition: service_healthy
    environment: &platform-api-env
      HCDR_HTTP_ADDR: 0.0.0.0:18080
      HCDR_BASE_URL: ${HCDR_BASE_URL:-https://hypercdr.com}
      HCDR_PUBLIC_BASE_URL: ${HCDR_PUBLIC_BASE_URL:-${HCDR_BASE_URL:-https://hypercdr.com}}
      HCDR_AGENT_WS_ENDPOINT: ${HCDR_AGENT_WS_ENDPOINT:-wss://hypercdr.com/ws/agent}
      HCDR_AGENT_PRIVATE_WS_ENDPOINT: ${HCDR_AGENT_PRIVATE_WS_ENDPOINT:-}
      HCDR_AGENT_PUBLIC_WS_ENDPOINT: ${HCDR_AGENT_PUBLIC_WS_ENDPOINT:-}
      HCDR_DATABASE_URL: ${HCDR_DATABASE_URL:?HCDR_DATABASE_URL is required}
      HCDR_IMAGE_REGISTRY: ${HCDR_IMAGE_REGISTRY:?HCDR_IMAGE_REGISTRY is required}
      HCDR_TLS_ENABLED: "false"
      HCDR_REGISTRY_CA_PATH: ${HCDR_REGISTRY_CA_PATH:-}
      HCDR_SECRET_KEY: ${HCDR_SECRET_KEY:-}
      HCDR_RELEASE_TOKEN: ${HCDR_RELEASE_TOKEN:?HCDR_RELEASE_TOKEN is required}
      HCDR_RELEASE_MANIFEST_PATH: ${HCDR_RELEASE_MANIFEST_PATH:-/deploy/current-release.json}
      HCDR_DEPLOY_MODE: docker-compose
      HCDR_DEPLOY_DIR: /deploy
      HCDR_REGISTRATION_EXECUTOR_ENDPOINT: http://hypercdr-cluster-registration-executor:18082
      HCDR_REGISTRATION_EXECUTOR_TOKEN: ${HCDR_REGISTRATION_EXECUTOR_TOKEN:?HCDR_REGISTRATION_EXECUTOR_TOKEN is required}
      HCDR_REGISTRATION_SESSION_DIR: /var/lib/hypercdr/registration-sessions
      HCDR_AUTH_CHALLENGE_MODE: ${HCDR_AUTH_CHALLENGE_MODE:-turnstile}
      HCDR_TURNSTILE_SITE_KEY: ${HCDR_TURNSTILE_SITE_KEY:-}
      HCDR_TURNSTILE_SECRET_KEY: ${HCDR_TURNSTILE_SECRET_KEY:-}
      HCDR_TURNSTILE_VERIFY_URL: ${HCDR_TURNSTILE_VERIFY_URL:-https://challenges.cloudflare.com/turnstile/v0/siteverify}
    volumes: &platform-api-volumes
      - ${HCDR_REGISTRY_CA_FILE:-/dev/null}:/etc/hypercdr/registry/ca.crt:ro
      - ${HCDR_INSTALL_DIR:-/var/lib/hypercdr}:/deploy
      - hypercdr-registration-sessions:/var/lib/hypercdr/registration-sessions
    networks:
      hypercdr-data: {}
      hypercdr-egress: {}
      hypercdr-blue:
        aliases: [hypercdr-platform-api]
    command: ["/bin/sh", "-c", "/usr/local/bin/platform-migrate && exec /usr/local/bin/platform-api"]
    restart: unless-stopped
    logging:
      driver: local
      options: { max-size: "50m", max-file: "5" }

  hypercdr-platform-api-green:
    image: ${PLATFORM_API_GREEN_IMAGE:?PLATFORM_API_GREEN_IMAGE is required}
    container_name: hypercdr-platform-api-green
    profiles: [green]
    depends_on:
      hypercdr-postgres:
        condition: service_healthy
    environment: *platform-api-env
    volumes: *platform-api-volumes
    networks:
      hypercdr-data: {}
      hypercdr-egress: {}
      hypercdr-green:
        aliases: [hypercdr-platform-api]
    command: ["/bin/sh", "-c", "/usr/local/bin/platform-migrate && exec /usr/local/bin/platform-api"]
    restart: unless-stopped
    logging:
      driver: local
      options: { max-size: "50m", max-file: "5" }

  hypercdr-platform-frontend-blue:
    image: ${PLATFORM_FRONTEND_BLUE_IMAGE:?PLATFORM_FRONTEND_BLUE_IMAGE is required}
    container_name: hypercdr-platform-frontend-blue
    profiles: [blue]
    networks: [hypercdr-blue]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped
    logging:
      driver: local
      options: { max-size: "50m", max-file: "5" }

  hypercdr-platform-frontend-green:
    image: ${PLATFORM_FRONTEND_GREEN_IMAGE:?PLATFORM_FRONTEND_GREEN_IMAGE is required}
    container_name: hypercdr-platform-frontend-green
    profiles: [green]
    networks: [hypercdr-green]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped
    logging:
      driver: local
      options: { max-size: "50m", max-file: "5" }

  hypercdr-cluster-registration-executor:
    image: ${REGISTRATION_EXECUTOR_IMAGE:?REGISTRATION_EXECUTOR_IMAGE is required}
    container_name: hypercdr-cluster-registration-executor
    depends_on:
      hypercdr-postgres:
        condition: service_healthy
    environment:
      SSL_CERT_DIR: /etc/ssl/certs:/usr/local/share/hypercdr-ca
      HCDR_DATABASE_URL: ${HCDR_DATABASE_URL:?HCDR_DATABASE_URL is required}
      HCDR_REGISTRATION_EXECUTOR_TOKEN: ${HCDR_REGISTRATION_EXECUTOR_TOKEN:?HCDR_REGISTRATION_EXECUTOR_TOKEN is required}
      HCDR_REGISTRATION_SESSION_DIR: /var/lib/hypercdr/registration-sessions
    volumes:
      # Optional private platform CA; public certificates use system trust.
      - ${HCDR_PLATFORM_CA_DIR:-./platform-ca}:/usr/local/share/hypercdr-ca:ro
      - hypercdr-registration-sessions:/var/lib/hypercdr/registration-sessions
    networks:
      hypercdr-data: {}
      hypercdr-proxy: {}
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: local
      options: { max-size: "50m", max-file: "5" }

networks:
  hypercdr-proxy:
    external: true
    name: ${HCDR_PROXY_NETWORK:-nginx-proxy-manager_default}
  hypercdr-data:
    internal: true
  hypercdr-egress:
    driver: bridge
  hypercdr-blue:
    internal: true
  hypercdr-green:
    internal: true

volumes:
  hypercdr-registration-sessions:
