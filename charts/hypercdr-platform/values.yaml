global:
  publicBaseURL: https://127.0.0.1:30080
  agentWebSocketURL: wss://127.0.0.1:30080/ws/agent
  agentPrivateWebSocketURL: ""
  agentPublicWebSocketURL: ""
  imageRegistry: ""

platform:
  replicaCount: 1
  image:
    repository: platform-api
    tag: v20260714.5
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    targetPort: 18080
    nodePort: 30080
  resources: {}
  logLevel: info
  agentNamespace: hypercdr-agent
  registryCA:
    enabled: false
    certificate: ""
  tls:
    enabled: false
    cert: ""
    key: ""

registrationExecutor:
  enabled: true
  image:
    repository: cluster-registration-executor
    tag: ""
    pullPolicy: IfNotPresent
  sessionStorage:
    storageClass: ""
    size: 1Gi

postgresql:
  mode: bundled
  image:
    repository: ""
    tag: "16"
    pullPolicy: IfNotPresent
  database: hypercdr
  username: hypercdr
  password: hypercdr
  storageClass: longhorn
  size: 20Gi
  resources: {}
  external:
    host: ""
    port: 5432
    database: hypercdr
    username: hypercdr
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: password

secrets:
  secretKey: dev-secret-change-me
  registrationExecutorToken: ""
