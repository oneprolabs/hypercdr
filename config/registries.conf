# HyperCDR container registry profiles. This file contains no credentials.
HCDR_ACTIVE_REGISTRY=aliyun_acr
HCDR_REGISTRY_PROFILES="aliyun_acr harbor_149"

HCDR_REGISTRY_ALIYUN_ACR_PROVIDER=aliyun-acr
HCDR_REGISTRY_ALIYUN_ACR_SERVER=registry.cn-beijing.aliyuncs.com
HCDR_REGISTRY_ALIYUN_ACR_PREFIX=registry.cn-beijing.aliyuncs.com/oneprolabs/hypercdr
HCDR_REGISTRY_ALIYUN_ACR_VISIBILITY=public
HCDR_REGISTRY_ALIYUN_ACR_TRUST=system
HCDR_REGISTRY_ALIYUN_ACR_CA_FILE=

HCDR_REGISTRY_HARBOR_149_PROVIDER=harbor
HCDR_REGISTRY_HARBOR_149_SERVER=192.168.8.149:5001
HCDR_REGISTRY_HARBOR_149_PREFIX=192.168.8.149:5001/hypercdr
HCDR_REGISTRY_HARBOR_149_VISIBILITY=private
HCDR_REGISTRY_HARBOR_149_TRUST=private-ca
HCDR_REGISTRY_HARBOR_149_CA_FILE=/data/harbor/cert/hypercdr-ca.crt

# Trusted publication sources available on the build host. These are mirrored
# by release scripts; the customized Velero image is always built from source.
HCDR_POSTGRES_SOURCE_IMAGE=postgres:16
HCDR_VELERO_PLUGIN_SOURCE_REGISTRY=docker.io/velero
